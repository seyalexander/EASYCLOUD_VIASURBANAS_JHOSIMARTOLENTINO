<section class="rounded-3xl bg-white p-5 ring-1 ring-slate-900/5 shadow-[0_10px_30px_-14px_rgba(15,23,42,0.12)]">
  <!-- Encabezado -->
  <div class="mb-4 flex items-center justify-between gap-3">
    <div class="flex min-w-0 items-center gap-3">
      <span
        class="flex h-10 w-10 shrink-0 items-center justify-center rounded-xl bg-linear-to-br from-[#005FAE] to-[#0A7FCB] text-white shadow-[0_8px_18px_-6px_rgba(0,95,174,0.6)]"
        aria-hidden="true"
      >
        <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 13l1.6-4.6A2 2 0 0 1 6.5 7h11a2 2 0 0 1 1.9 1.4L21 13" />
          <rect x="3" y="13" width="18" height="5" rx="1.5" />
          <circle cx="7.5" cy="18" r="1.5" />
          <circle cx="16.5" cy="18" r="1.5" />
        </svg>
      </span>
      <h2 class="truncate text-base font-extrabold tracking-tight text-slate-900">Vehículos de Diseño</h2>
    </div>

    <span class="shrink-0 rounded-full bg-[#005FAE]/8 px-2.5 py-1 text-[11px] font-bold tabular-nums text-[#005FAE]">
      {{ vehiculos().length }} opciones
    </span>
  </div>

  <!-- Lista de vehículos -->
  <div class="lista-vehiculos -mr-1 flex h-[calc(100dvh-12rem)] flex-col gap-3 overflow-y-auto p-1 pr-2">
    @for (vehiculo of vehiculos(); track vehiculo.id) {
      <button
        type="button"
        (click)="seleccionarVehiculo.emit(vehiculo.id)"
        [attr.aria-pressed]="vehiculo.id === vehiculoSeleccionado().id"
        [class]="claseTarjetaVehiculo(vehiculo.id === vehiculoSeleccionado().id)"
      >
        <!-- Check de selección -->
        @if (vehiculo.id === vehiculoSeleccionado().id) {
          <span
            class="absolute right-3 top-3 flex h-5 w-5 items-center justify-center rounded-full bg-[#005FAE] text-white shadow-[0_4px_10px_-2px_rgba(0,95,174,0.6)]"
            aria-hidden="true"
          >
            <svg class="h-3 w-3" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
              <path d="M5 12.5l4.5 4.5L19 7.5" />
            </svg>
          </span>
        }

        <div class="mb-2.5 flex items-center gap-3 pr-6">
          <!-- Silueta SVG según categoría -->
          <div [class]="claseSiluetaVehiculo(vehiculo.id === vehiculoSeleccionado().id)">
            <svg viewBox="0 0 64 28" class="h-5 w-10" fill="currentColor" aria-hidden="true">
              @if (vehiculo.categoria === 'Articulado') {
                <rect x="2" y="6" width="38" height="14" rx="2" />
                <rect x="42" y="8" width="18" height="12" rx="2" />
                <circle cx="10" cy="22" r="3.5" fill="#0f172a" />
                <circle cx="32" cy="22" r="3.5" fill="#0f172a" />
                <circle cx="53" cy="22" r="3.5" fill="#0f172a" />
              } @else if (vehiculo.categoria === 'Bus' || vehiculo.categoria === 'Camión Rígido') {
                <rect x="4" y="5" width="54" height="15" rx="3" />
                <circle cx="15" cy="22" r="3.5" fill="#0f172a" />
                <circle cx="48" cy="22" r="3.5" fill="#0f172a" />
              } @else {
                <path d="M8 14 L16 7 H44 L54 14 H58 V20 H6 V14 Z" />
                <circle cx="17" cy="21" r="3.5" fill="#0f172a" />
                <circle cx="47" cy="21" r="3.5" fill="#0f172a" />
              }
            </svg>
          </div>

          <div class="min-w-0">
            <div class="truncate text-sm font-bold tracking-tight text-slate-900">{{ vehiculo.nombre }}</div>
            <span class="mt-0.5 inline-block rounded-full bg-[#005FAE]/8 px-2 py-0.5 text-[10px] font-semibold uppercase tracking-wider text-[#005FAE]">
              {{ vehiculo.categoria }}
            </span>
          </div>
        </div>

        <p class="mb-3 line-clamp-2 text-xs leading-relaxed text-slate-600">
          {{ vehiculo.descripcion }}
        </p>

        <!-- Medidas -->
        <div class="grid grid-cols-4 gap-1.5">
          <div class="rounded-xl bg-white px-2 py-1.5 ring-1 ring-slate-900/5">
            <span class="block text-[10px] font-semibold uppercase tracking-wide text-slate-400">Largo</span>
            <span class="block text-xs font-bold tabular-nums text-slate-800">{{ vehiculo.largoMetros.toFixed(2) }}m</span>
          </div>
          <div class="rounded-xl bg-white px-2 py-1.5 ring-1 ring-slate-900/5">
            <span class="block text-[10px] font-semibold uppercase tracking-wide text-slate-400">Ancho</span>
            <span class="block text-xs font-bold tabular-nums text-slate-800">{{ vehiculo.anchoMetros.toFixed(2) }}m</span>
          </div>
          <div class="rounded-xl bg-white px-2 py-1.5 ring-1 ring-slate-900/5">
            <span class="block text-[10px] font-semibold uppercase tracking-wide text-slate-400">Ejes</span>
            <span class="block text-xs font-bold tabular-nums text-slate-800">{{ vehiculo.distanciaEjesMetros.toFixed(2) }}m</span>
          </div>
          <!-- Radio de giro destacado en naranja -->
          <div class="rounded-xl bg-[#EE8600]/8 px-2 py-1.5 ring-1 ring-[#EE8600]/20">
            <span class="block text-[10px] font-semibold uppercase tracking-wide text-[#b86500]/80">R. Giro</span>
            <span class="block text-xs font-bold tabular-nums text-[#b86500]">{{ vehiculo.radioMinimoGiroMetros.toFixed(1) }}m</span>
          </div>
        </div>
      </button>
    }
  </div>

  <!-- Medidas personalizadas -->
  @if (vehiculoSeleccionado().esPersonalizable) {
    <div class="my-5 h-px bg-linear-to-r from-transparent via-slate-200 to-transparent" aria-hidden="true"></div>

    <div class="mb-3 flex items-center gap-2">
      <span class="h-2 w-2 rounded-full bg-[#EE8600]" aria-hidden="true"></span>
      <h3 class="text-[11px] font-semibold uppercase tracking-wider text-slate-500">Medidas personalizadas</h3>
    </div>

    <div class="grid grid-cols-2 gap-3">
      <label class="flex flex-col gap-1.5">
        <span class="flex items-center justify-between text-xs font-semibold text-slate-600">
          Largo total <span class="font-medium text-slate-400">m</span>
        </span>
        <input
          type="number"
          step="0.1"
          min="2"
          max="25"
          [ngModel]="vehiculoSeleccionado().largoMetros"
          (ngModelChange)="actualizarCampoPersonalizado('largoMetros', $event)"
          [class]="claseCampo"
        />
      </label>

      <label class="flex flex-col gap-1.5">
        <span class="flex items-center justify-between text-xs font-semibold text-slate-600">
          Ancho total <span class="font-medium text-slate-400">m</span>
        </span>
        <input
          type="number"
          step="0.05"
          min="1.2"
          max="4"
          [ngModel]="vehiculoSeleccionado().anchoMetros"
          (ngModelChange)="actualizarCampoPersonalizado('anchoMetros', $event)"
          [class]="claseCampo"
        />
      </label>

      <label class="flex flex-col gap-1.5">
        <span class="flex items-center justify-between text-xs font-semibold text-slate-600">
          Entre ejes <span class="font-medium text-slate-400">m</span>
        </span>
        <input
          type="number"
          step="0.1"
          min="1.5"
          max="18"
          [ngModel]="vehiculoSeleccionado().distanciaEjesMetros"
          (ngModelChange)="actualizarCampoPersonalizado('distanciaEjesMetros', $event)"
          [class]="claseCampo"
        />
      </label>

      <label class="flex flex-col gap-1.5">
        <span class="flex items-center justify-between text-xs font-semibold text-slate-600">
          Vuelo delantero <span class="font-medium text-slate-400">m</span>
        </span>
        <input
          type="number"
          step="0.1"
          min="0.2"
          max="5"
          [ngModel]="vehiculoSeleccionado().vueloDelanteroMetros"
          (ngModelChange)="actualizarCampoPersonalizado('vueloDelanteroMetros', $event)"
          [class]="claseCampo"
        />
      </label>

      <label class="flex flex-col gap-1.5">
        <span class="flex items-center justify-between text-xs font-semibold text-slate-600">
          Vuelo trasero <span class="font-medium text-slate-400">m</span>
        </span>
        <input
          type="number"
          step="0.1"
          min="0.2"
          max="6"
          [ngModel]="vehiculoSeleccionado().vueloTraseroMetros"
          (ngModelChange)="actualizarCampoPersonalizado('vueloTraseroMetros', $event)"
          [class]="claseCampo"
        />
      </label>

      <label class="flex flex-col gap-1.5">
        <span class="flex items-center justify-between text-xs font-semibold text-slate-600">
          Holgura lateral <span class="font-medium text-slate-400">m</span>
        </span>
        <input
          type="number"
          step="0.05"
          min="0.1"
          max="2.5"
          [ngModel]="vehiculoSeleccionado().holguraSeguridadMetros"
          (ngModelChange)="actualizarCampoPersonalizado('holguraSeguridadMetros', $event)"
          [class]="claseCampo"
        />
      </label>
    </div>
  }
</section>
