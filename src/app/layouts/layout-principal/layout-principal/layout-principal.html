<div class="flex h-dvh flex-col bg-slate-50 text-slate-900 bg-[radial-gradient(60rem_28rem_at_50%_-8%,rgba(0,95,174,0.09),transparent)]">
  <!-- HEADER -->
  <header class="relative z-30 shrink-0 bg-white/80 backdrop-blur-md shadow-[0_8px_24px_-18px_rgba(0,59,115,0.35)]">
    <!-- Franja de acento con los colores corporativos -->
    <div class="h-0.75 w-full bg-linear-to-r from-[#005FAE] via-[#3FBFEF] to-[#EE8600]" aria-hidden="true"></div>

    <div class="mx-auto flex h-16 max-w-7xl items-center justify-between gap-4 px-4 sm:px-6">
      <!-- Marca -->
      <a routerLink="/bienvenida" class="group flex min-w-0 items-center gap-3">
        <span
          class="relative inline-flex h-10 w-10 shrink-0 items-center justify-center rounded-xl bg-linear-to-br from-[#005FAE] to-[#0A7FCB] text-sm font-extrabold tracking-tight text-white shadow-[0_8px_18px_-6px_rgba(0,95,174,0.6)] transition-transform duration-300 group-hover:-rotate-3 group-hover:scale-105"
          aria-hidden="true"
        >
          GV
          <span class="absolute -right-0.5 -top-0.5 h-3 w-3 rounded-full bg-[#EE8600] ring-2 ring-white"></span>
        </span>

        <span class="flex min-w-0 flex-col leading-tight">
          <span class="truncate text-base font-extrabold tracking-tight text-slate-900 sm:text-lg">
            {{ nombreApp }}
          </span>
          <span class="hidden truncate text-[11px] font-medium text-slate-500 sm:block">
            {{ descripcionApp }}
          </span>
        </span>
      </a>

      <!-- Navegación -->
      <nav class="flex items-center gap-1 rounded-2xl bg-slate-100/90 p-1" aria-label="Navegación principal">
        <a
          routerLink="/bienvenida"
          routerLinkActive="bg-white text-[#005FAE] shadow-sm ring-1 ring-slate-900/5"
          ariaCurrentWhenActive="page"
          class="inline-flex items-center gap-2 rounded-xl px-3.5 py-2 text-sm font-semibold text-slate-600 transition-all duration-200 hover:text-[#005FAE]"
        >
          <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M3 11.5L12 4l9 7.5" />
            <path d="M5.5 10.5V20h13v-9.5" />
          </svg>
          <span class="hidden sm:inline">Bienvenida</span>
        </a>

        <a
          routerLink="/simulacion"
          routerLinkActive="bg-white text-[#005FAE] shadow-sm ring-1 ring-slate-900/5"
          ariaCurrentWhenActive="page"
          class="inline-flex items-center gap-2 rounded-xl px-3.5 py-2 text-sm font-semibold text-slate-600 transition-all duration-200 hover:text-[#005FAE]"
        >
          <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M4 20V10a6 6 0 0 1 6-6h10" />
            <circle cx="4" cy="20" r="1" />
            <circle cx="20" cy="4" r="1" />
          </svg>
          <span class="hidden sm:inline">Simulación</span>
        </a>
      </nav>
    </div>
  </header>

  <!-- CONTENIDO: solo esta zona hace scroll cuando hace falta -->
  <main class="min-h-0 flex-1 overflow-y-auto px-4 py-4 sm:px-6 sm:py-5">
    <router-outlet />
  </main>

  <!-- FOOTER -->
  <!-- <footer class="shrink-0 px-4 py-2.5 text-center text-xs font-medium text-slate-400 sm:px-6">
    <span class="inline-flex items-center gap-2">
      <span class="h-1.5 w-1.5 rounded-full bg-[#EE8600]" aria-hidden="true"></span>
      Universidad Privada Antenor Orrego · UPAO · {{ anio }}
    </span>
  </footer> -->
</div>
